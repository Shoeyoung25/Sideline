<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Sideline</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout idea: a coach's whiteboard. One screen, scoreboard strip on top, the board in the middle, the call sheet pinned at the bottom. */
:root {
  color-scheme: light;
  --board: #eef0ea;
  --panel: #ffffff;
  --ink: #18202e;
  --muted: #5b6474;
  --line: #d3d8ce;
  --blue: #1c5fd4;
  --red: #d2382d;
  --wood: #dcae74;
  --wood-dark: #c4935a;
  --hi: #ffd54a;
  --good: #1f8a4c;
  --f-display: "Barlow Condensed", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --f-body: "Barlow", "Helvetica Neue", Arial, sans-serif;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
html, body { height: 100%; margin: 0; }
body { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-text-size-adjust: 100%; background: var(--board); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.35; overscroll-behavior: none; }
button, input, select { font: inherit; color: inherit; }
input { -webkit-user-select: text; user-select: text; font-size: 16px; }
button { cursor: pointer; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid var(--hi); outline-offset: 1px; }
#app { height: 100%; height: 100dvh; display: flex; flex-direction: column; max-width: 560px; margin: 0 auto; background: var(--board); }

/* scoreboard */
#hud { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; padding: 8px 14px; background: var(--ink); color: #fff; font-family: var(--f-display); }
#hud .tm { display: flex; align-items: baseline; gap: 8px; font-size: 18px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; }
#hud .tm.r { justify-content: flex-end; }
#hud .tm b { font-size: 30px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1; }
#hud .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; align-self: center; }
#hud .tm .ballmark { width: 9px; height: 9px; border-radius: 50%; background: #f08a24; align-self: center; visibility: hidden; }
#hud .tm.has .ballmark { visibility: visible; }
#hud .mid { text-align: center; font-size: 14px; letter-spacing: .08em; text-transform: uppercase; color: #c9d0dc; }
#hud .mid strong { display: block; font-size: 22px; color: #fff; font-variant-numeric: tabular-nums; line-height: 1; }

#screen { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; }
.pad { padding: 14px 16px; display: flex; flex-direction: column; gap: 14px; }
h1, h2, h3 { font-family: var(--f-display); margin: 0; text-wrap: balance; letter-spacing: .02em; }
h1 { font-size: 44px; font-weight: 700; text-transform: uppercase; line-height: .95; }
h2 { font-size: 24px; font-weight: 700; text-transform: uppercase; }
h3 { font-size: 15px; font-weight: 600; text-transform: uppercase; letter-spacing: .09em; color: var(--muted); }
p { margin: 0; }
.muted { color: var(--muted); }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.grow { flex: 1; min-width: 0; }
.btn { border: 1.5px solid var(--ink); background: var(--panel); border-radius: 8px; padding: 10px 14px; font-family: var(--f-display); font-size: 18px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; }
.btn.primary { background: var(--ink); color: #fff; }
.btn.small { padding: 6px 10px; font-size: 15px; border-width: 1px; }
.btn:disabled { opacity: .4; cursor: default; }
.btn.blue { background: var(--blue); border-color: var(--blue); color: #fff; }
.btn.red { background: var(--red); border-color: var(--red); color: #fff; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 7px 12px; font-size: 14px; font-weight: 500; }
.chip.on { background: var(--ink); border-color: var(--ink); color: #fff; }
.note { font-size: 13px; color: var(--muted); }
.foot { position: sticky; bottom: 0; padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); background: linear-gradient(to top, var(--board) 70%, transparent); display: flex; gap: 8px; }
.foot .btn { flex: 1; }
.tag { display: inline-block; font-family: var(--f-display); font-size: 13px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; padding: 2px 8px; border-radius: 4px; color: #fff; }
.tag.t0 { background: var(--blue); } .tag.t1 { background: var(--red); }
.banner { border-left: 5px solid var(--hi); background: var(--panel); padding: 8px 12px; border-radius: 0 8px 8px 0; font-size: 14px; }
input[type=text], select { border: 1px solid var(--line); border-radius: 8px; padding: 9px 10px; background: var(--panel); width: 100%; min-width: 0; }
.code { font-family: var(--f-display); font-size: 40px; font-weight: 700; letter-spacing: .2em; }

/* home */
.steps { display: grid; gap: 8px; counter-reset: st; }
.steps div { display: grid; grid-template-columns: 26px 1fr; gap: 8px; align-items: baseline; }
.steps div::before { counter-increment: st; content: counter(st); font-family: var(--f-display); font-weight: 700; font-size: 20px; color: var(--muted); }

/* draft */
.rosters { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.roster { border-radius: 8px; padding: 8px; background: var(--panel); border: 1px solid var(--line); border-top: 4px solid var(--blue); font-size: 13px; min-height: 118px; }
.roster.t1 { border-top-color: var(--red); }
.roster.turn { box-shadow: 0 0 0 3px var(--hi); }
.roster ol { margin: 4px 0 0; padding-left: 18px; }
.prow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 10px; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--line); }
.prow .nm { font-weight: 600; }
.prow .sub { font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.rt { display: flex; gap: 4px; flex-wrap: wrap; grid-column: 1 / -1; }
.rt span { font-size: 11.5px; font-variant-numeric: tabular-nums; padding: 1px 6px; border-radius: 4px; background: var(--board); border: 1px solid var(--line); }
.rt span.hot { background: #e3f3e8; border-color: #a9d6b9; color: #14522e; font-weight: 600; }
.rt span.cold { color: #9a3a33; }
.ovr { font-family: var(--f-display); font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; }

/* coaching */
.slot { display: grid; grid-template-columns: 84px 1fr; gap: 10px; align-items: center; }
.slot canvas { width: 84px; height: 79px; border-radius: 6px; border: 1px solid var(--line); background: var(--wood); }
.slot .nm { font-weight: 600; }
.mrow { display: grid; grid-template-columns: 1fr 14px 1.35fr auto; gap: 6px; align-items: center; padding: 7px 8px; border: 1px solid var(--line); border-radius: 10px; margin-top: 6px; cursor: pointer; background: var(--panel); }
.mrow.on { border-color: var(--ink, #18202e); box-shadow: 0 0 0 2px var(--hi); }
.mrow .who { display: flex; flex-direction: column; min-width: 0; font-size: 12px; color: var(--muted); }
.mrow .who b { font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } .mrow b.t0 { color: var(--blue); } .mrow b.t1 { color: var(--red); }
.mrow .arr { color: var(--muted); } .mrow .pp { padding: 5px 9px; font-size: 12.5px; }
.edges i { font-style: normal; font-size: 11px; font-weight: 600; margin-right: 6px; } .edges .bad { color: var(--red); } .edges .ok { color: #1f9d55; }
.story { margin-top: 6px; font-size: 13px; } .story summary { cursor: pointer; } .story div { color: var(--muted); padding: 2px 0 0 14px; }
.look { font-weight: 600; } .look.good { color: #1f9d55; }
.match { display: grid; grid-template-columns: 1fr 1.25fr 86px; gap: 6px; align-items: center; font-size: 13.5px; }
.match select { padding: 7px 6px; font-size: 13.5px; }
.lineup { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; font-size: 11.5px; text-align: center; }
.lineup div { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 4px 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lineup b { display: block; font-family: var(--f-display); font-size: 16px; }

h4 { font-family: var(--f-display); font-size: 14px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0 0 5px; }
.field + .field { border-top: 1px solid var(--line); padding-top: 10px; }
.field .note { margin-top: 5px; }
.banner.res { display: flex; align-items: baseline; gap: 10px; }
.banner.res b { font-family: var(--f-display); font-size: 24px; font-weight: 700; text-transform: uppercase; white-space: nowrap; }
.banner.res b.t0 { color: var(--blue); } .banner.res b.t1 { color: var(--red); }
.scrollx { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; } .scrollx .chip { flex: none; }
.pname { all: unset; cursor: pointer; display: block; min-width: 0; }
.pname:focus-visible { outline: 3px solid var(--hi); }
.attrs { grid-column: 1 / -1; display: grid; grid-template-columns: 1fr 1fr; gap: 10px 16px; padding: 8px 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; }
.agroup h3 { font-size: 12px; margin-bottom: 3px; }
.arow { display: grid; grid-template-columns: 1fr 44px 24px; gap: 6px; align-items: center; font-size: 12.5px; padding: 1px 0; }
.arow b { font-variant-numeric: tabular-nums; text-align: right; } .arow b.hot { color: var(--good); } .arow b.cold { color: var(--red); }
.abar { height: 5px; background: var(--board); border-radius: 3px; overflow: hidden; } .abar i { display: block; height: 100%; background: var(--ink); }
#feedlist { position: absolute; left: 10px; right: 10px; display: grid; gap: 2px; font-size: 12.5px; color: rgba(24,32,46,.8); pointer-events: none; }
#feedlist.bot { bottom: 10px; } #feedlist.top { top: 10px; }
#feedlist div { background: rgba(255,255,255,.72); border-radius: 5px; padding: 2px 7px; width: fit-content; max-width: 100%; }
#feedlist div:last-child { color: var(--ink); font-weight: 500; }
#flash { position: absolute; left: 50%; top: 74%; transform: translate(-50%, -50%); font-family: var(--f-display); font-size: 54px; font-weight: 700; text-transform: uppercase; letter-spacing: .03em; color: #fff; padding: 6px 22px; border-radius: 10px; white-space: nowrap; display: none; pointer-events: none; box-shadow: 0 6px 24px rgba(0,0,0,.35); }
#flash.on { display: block; } #flash.t0 { background: var(--blue); } #flash.t1 { background: var(--red); }
.feed { display: flex; flex-direction: column; min-width: 0; } #toastprev { font-size: 12px; color: var(--muted); font-weight: 400; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.box { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
.box th { font-family: var(--f-display); font-size: 12px; letter-spacing: .06em; color: var(--muted); text-align: right; padding: 3px 4px; font-weight: 600; }
.box th:first-child, .box td:first-child { text-align: left; }
.box td { text-align: right; padding: 4px; border-top: 1px solid var(--line); }
.box + .box { margin-top: 6px; }

/* overlays */
#overlay:empty { display: none; }
#overlay { position: fixed; inset: 0; background: var(--board); z-index: 10; display: flex; flex-direction: column; max-width: 560px; margin: 0 auto; }
.ohead { display: flex; align-items: center; gap: 8px; padding: 10px 12px; background: var(--ink); color: #fff; }
.ohead h2 { flex: 1; font-size: 20px; }
.ohead .btn { background: transparent; color: #fff; border-color: #fff; }
.ohead .btn.primary { background: #fff; color: var(--ink); }
.obody { flex: 1; min-height: 0; overflow-y: auto; }
.tabs { display: flex; gap: 0; overflow-x: auto; background: var(--panel); border-bottom: 1px solid var(--line); scrollbar-width: none; }
.tabs button { border: 0; background: none; padding: 11px 13px; font-family: var(--f-display); font-size: 16px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; white-space: nowrap; color: var(--muted); border-bottom: 3px solid transparent; }
.tabs button.on { color: var(--ink); border-bottom-color: var(--ink); }
.pcard { display: grid; grid-template-columns: 120px 1fr; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--line); align-items: center; }
.pcard canvas { width: 120px; height: 113px; border-radius: 6px; background: var(--wood); border: 1px solid var(--line); }
.edwrap { padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }
#edcanvas { width: 100%; touch-action: none; border-radius: 8px; background: var(--wood); border: 1px solid var(--wood-dark); display: block; }
.hint { font-size: 13.5px; min-height: 19px; }
.hint b { background: var(--hi); padding: 0 4px; border-radius: 3px; }

/* live */
.live { flex: 1; min-height: 0; display: flex; flex-direction: column; }
#toast { padding: 6px 14px; font-size: 14.5px; font-weight: 500; min-height: 46px; background: var(--panel); border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 8px; }
#toast .sc { margin-left: auto; font-family: var(--f-display); font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; min-width: 28px; text-align: right; }
#toast .sc.low { color: var(--red); }
#courtwrap { flex: 1; min-height: 0; position: relative; background: #2a3240; }
#court { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; display: block; }
.calls { display: flex; flex-wrap: wrap; gap: 5px; padding: 6px 10px; align-items: center; background: var(--panel); border-top: 1px solid var(--line); scrollbar-width: none; }
.calls .tag { flex: none; }
.calls .btn { flex: none; padding: 7px 9px; font-size: 15px; white-space: nowrap; }
.calls .btn.arm { background: var(--hi); border-color: var(--ink); color: var(--ink); }
.calls:last-child { padding-bottom: calc(7px + env(safe-area-inset-bottom)); }
.recap summary { cursor: pointer; list-style: none; } .recap summary h3 { display: inline; } .recap summary::after { content: '  show'; font-size: 12px; color: var(--muted); } .recap[open] summary::after { content: '  hide'; }
.hrow { display: flex; gap: 10px; align-items: flex-start; padding: 7px 0; border-top: 1px solid var(--line); margin-top: 7px; } .hrow b.t0 { color: var(--blue); } .hrow b.t1 { color: var(--red); } .hrow p { margin: 2px 0 0; }
#courtwrap.slow::after { content: 'COACH CALL'; position: absolute; inset: 0; box-shadow: inset 0 0 0 4px var(--hi), inset 0 0 60px rgba(0,0,0,.45); pointer-events: none; display: flex; justify-content: center; align-items: flex-start; padding-top: 8px; font-family: var(--f-display); font-weight: 700; letter-spacing: .12em; color: #fff; font-size: 15px; text-shadow: 0 1px 4px rgba(0,0,0,.7); }
.sit { margin: 0; font-size: 13.5px; font-weight: 600; } .sit.late { color: var(--red); font-size: 15px; }
.quick .chip { font-weight: 600; }
.basic .adv { display: none; } .advbtn { align-self: stretch; text-align: center; }
.wp { grid-column: 1 / -1; position: relative; height: 14px; border-radius: 7px; background: var(--red); overflow: hidden; font: 600 10px/14px var(--f-body, Barlow, Arial, sans-serif); }
.wp i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--blue); transition: width .6s ease; } .wp span { position: absolute; left: 7px; color: #fff; } .wp span.r { left: auto; right: 7px; }
.mvp b.t0 { color: var(--blue); } .mvp b.t1 { color: var(--red); } .mvp p { margin: 0; font-size: 14.5px; line-height: 1.5; }
p.note.warn { color: var(--red); font-weight: 600; }
.say textarea { width: 100%; box-sizing: border-box; font: inherit; font-size: 15px; padding: 9px 10px; border: 1.5px solid var(--ink); border-radius: 8px; resize: vertical; background: #fff; }
.say .got { color: #1f7a45; font-size: 13.5px; font-weight: 600; padding: 1px 0; } .say .missed { color: var(--red); font-size: 13px; padding: 1px 0; }
.tend .trow { display: flex; gap: 10px; align-items: baseline; font-size: 13.5px; } .tend .pp { color: var(--muted); min-width: 52px; text-align: right; } .tend .pp.good { color: #1f7a45; font-weight: 700; }
.prep p { margin: 0; font-size: 14px; } .prep b.good { color: #1f7a45; } .prep b.bad { color: var(--red); }
.testres .trow { display: flex; gap: 10px; align-items: baseline; font-size: 13.5px; } .testres .pp { color: var(--muted); min-width: 60px; text-align: right; } .testres .pp.good { color: #1f7a45; font-weight: 700; }
.board canvas.big { width: 100%; height: auto; border-radius: 10px; display: block; } .board h4 { margin: 4px 0 6px; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.strip { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; } .thumb { flex: 0 0 auto; width: 108px; padding: 2px; border: 2px solid var(--line); border-radius: 10px; background: var(--panel); display: flex; flex-direction: column; gap: 2px; font: 600 11.5px/1.2 inherit; color: var(--ink); cursor: pointer; }
.thumb canvas { width: 100%; height: auto; border-radius: 7px; } .thumb.on { border-color: var(--ink); } .thumb span { padding: 0 3px 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
p.note.fresh { color: #1f7a45; font-weight: 600; }
.guard .grow2 { display: grid; grid-template-columns: 112px 1fr; gap: 10px; align-items: start; padding: 8px; border: 1px solid var(--line); border-radius: 10px; } .guard .grow2.on { border-color: var(--ink); box-shadow: 0 0 0 2px var(--hi); }
.guard canvas { width: 112px; height: auto; border-radius: 8px; } .guard .nm { font-weight: 600; margin-bottom: 6px; } .guard .grow2 > div { display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
#planbar { display: flex; gap: 6px; padding: 4px 10px; font-size: 12.5px; font-weight: 600; background: var(--panel); border-bottom: 1px solid var(--line); min-height: 26px; overflow: hidden; }
#planbar span { padding: 2px 8px; border-radius: 999px; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 0 1 auto; }
#planbar span:first-child { flex: 0 0 auto; max-width: 70%; }
#planbar #link { margin-left: auto; background: none; color: var(--muted); font-weight: 500; padding: 2px 0; flex: 0 0 auto; } #planbar #link.good { color: #1f9d55; } #planbar #link.weak { color: var(--red); font-weight: 700; }
#planbar .t0 { background: var(--blue); } #planbar .t1 { background: var(--red); }
.scout p { margin: 2px 0; font-size: 13.5px; }
#livehint { padding: 4px 14px; font-size: 13px; background: var(--hi); display: none; }
#livehint.on { display: block; }
.center { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 16px; padding: 24px 20px; }
.big { font-family: var(--f-display); font-size: 64px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.loglist { font-size: 13.5px; color: var(--muted); display: grid; gap: 3px; }
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto; } }
</style>
</head>
<body>
<div id="app">
  <header id="hud"></header>
  <main id="screen"></main>
</div>
<div id="overlay"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
/* Always run the newest version. Browsers keep old copies of pages, so on every open this asks the server
   (bypassing the cache) which build is current, reloads if this page is older, and loads the game files
   under that build's name so a stale copy can never be used. */
(function () {
  var BUILD = 'Nov 26 22:30'; window.SIDELINE_BUILD = BUILD;
  function load(v) {
    var files = ['data.js', 'engine.js', 'app.js'], i = 0;
    (function next() { if (i >= files.length) return; var s = document.createElement('script'); s.src = files[i++] + '?v=' + encodeURIComponent(v); s.onload = next; s.onerror = next; document.body.appendChild(s); })();
  }
  window.sidelineLatest = function () { return fetch('version.json?t=' + Date.now(), { cache: 'no-store' }).then(function (r) { return r.json(); }).then(function (j) { return String(j.v); }); };
  window.sidelineReload = function (v) { location.replace(location.pathname + '?v=' + encodeURIComponent(v)); };
  var asked = (location.search.match(/[?&]v=([^&]+)/) || [])[1];
  window.sidelineLatest().then(function (v) {
    if (v !== BUILD && decodeURIComponent(asked || '') !== v) { window.sidelineReload(v); return; }
    load(v);
  }).catch(function () { load(BUILD); });
})();
</script>
</body>
</html>
