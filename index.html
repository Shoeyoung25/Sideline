<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Sideline</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout idea: a coach's whiteboard. One screen, scoreboard strip on top, the board in the middle, the call sheet pinned at the bottom. */
:root {
  color-scheme: light;
  --board: #eef0ea;
  --panel: #ffffff;
  --ink: #18202e;
  --muted: #5b6474;
  --line: #d3d8ce;
  --blue: #1c5fd4;
  --red: #d2382d;
  --wood: #dcae74;
  --wood-dark: #c4935a;
  --hi: #ffd54a;
  --good: #1f8a4c;
  --f-display: "Barlow Condensed", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --f-body: "Barlow", "Helvetica Neue", Arial, sans-serif;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; margin: 0; }
body { background: var(--board); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.35; overscroll-behavior: none; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid var(--hi); outline-offset: 1px; }
#app { height: 100%; display: flex; flex-direction: column; max-width: 560px; margin: 0 auto; background: var(--board); }

/* scoreboard */
#hud { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; padding: 8px 14px; background: var(--ink); color: #fff; font-family: var(--f-display); }
#hud .tm { display: flex; align-items: baseline; gap: 8px; font-size: 18px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; }
#hud .tm.r { justify-content: flex-end; }
#hud .tm b { font-size: 30px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1; }
#hud .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; align-self: center; }
#hud .tm .ballmark { width: 9px; height: 9px; border-radius: 50%; background: #f08a24; align-self: center; visibility: hidden; }
#hud .tm.has .ballmark { visibility: visible; }
#hud .mid { text-align: center; font-size: 14px; letter-spacing: .08em; text-transform: uppercase; color: #c9d0dc; }
#hud .mid strong { display: block; font-size: 22px; color: #fff; font-variant-numeric: tabular-nums; line-height: 1; }

#screen { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; }
.pad { padding: 14px 16px; display: flex; flex-direction: column; gap: 14px; }
h1, h2, h3 { font-family: var(--f-display); margin: 0; text-wrap: balance; letter-spacing: .02em; }
h1 { font-size: 44px; font-weight: 700; text-transform: uppercase; line-height: .95; }
h2 { font-size: 24px; font-weight: 700; text-transform: uppercase; }
h3 { font-size: 15px; font-weight: 600; text-transform: uppercase; letter-spacing: .09em; color: var(--muted); }
p { margin: 0; }
.muted { color: var(--muted); }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.grow { flex: 1; min-width: 0; }
.btn { border: 1.5px solid var(--ink); background: var(--panel); border-radius: 8px; padding: 10px 14px; font-family: var(--f-display); font-size: 18px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; }
.btn.primary { background: var(--ink); color: #fff; }
.btn.small { padding: 6px 10px; font-size: 15px; border-width: 1px; }
.btn:disabled { opacity: .4; cursor: default; }
.btn.blue { background: var(--blue); border-color: var(--blue); color: #fff; }
.btn.red { background: var(--red); border-color: var(--red); color: #fff; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 7px 12px; font-size: 14px; font-weight: 500; }
.chip.on { background: var(--ink); border-color: var(--ink); color: #fff; }
.note { font-size: 13px; color: var(--muted); }
.foot { position: sticky; bottom: 0; padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); background: linear-gradient(to top, var(--board) 70%, transparent); display: flex; gap: 8px; }
.foot .btn { flex: 1; }
.tag { display: inline-block; font-family: var(--f-display); font-size: 13px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; padding: 2px 8px; border-radius: 4px; color: #fff; }
.tag.t0 { background: var(--blue); } .tag.t1 { background: var(--red); }
.banner { border-left: 5px solid var(--hi); background: var(--panel); padding: 8px 12px; border-radius: 0 8px 8px 0; font-size: 14px; }
input[type=text], select { border: 1px solid var(--line); border-radius: 8px; padding: 9px 10px; background: var(--panel); width: 100%; min-width: 0; }
.code { font-family: var(--f-display); font-size: 40px; font-weight: 700; letter-spacing: .2em; }

/* home */
.steps { display: grid; gap: 8px; counter-reset: st; }
.steps div { display: grid; grid-template-columns: 26px 1fr; gap: 8px; align-items: baseline; }
.steps div::before { counter-increment: st; content: counter(st); font-family: var(--f-display); font-weight: 700; font-size: 20px; color: var(--muted); }

/* draft */
.rosters { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.roster { border-radius: 8px; padding: 8px; background: var(--panel); border: 1px solid var(--line); border-top: 4px solid var(--blue); font-size: 13px; min-height: 118px; }
.roster.t1 { border-top-color: var(--red); }
.roster.turn { box-shadow: 0 0 0 3px var(--hi); }
.roster ol { margin: 4px 0 0; padding-left: 18px; }
.prow { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--line); }
.prow .nm { font-weight: 600; }
.prow .sub { font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.rt { display: flex; gap: 4px; flex-wrap: wrap; grid-column: 1 / -1; }
.rt span { font-size: 11.5px; font-variant-numeric: tabular-nums; padding: 1px 6px; border-radius: 4px; background: var(--board); border: 1px solid var(--line); }
.rt span.hot { background: #e3f3e8; border-color: #a9d6b9; color: #14522e; font-weight: 600; }
.rt span.cold { color: #9a3a33; }
.ovr { font-family: var(--f-display); font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; }

/* coaching */
.slot { display: grid; grid-template-columns: 84px 1fr; gap: 10px; align-items: center; }
.slot canvas { width: 84px; height: 79px; border-radius: 6px; border: 1px solid var(--line); background: var(--wood); }
.slot .nm { font-weight: 600; }
.match { display: grid; grid-template-columns: 1fr 1.25fr 86px; gap: 6px; align-items: center; font-size: 13.5px; }
.match select { padding: 7px 6px; font-size: 13.5px; }
.lineup { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; font-size: 11.5px; text-align: center; }
.lineup div { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 4px 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lineup b { display: block; font-family: var(--f-display); font-size: 16px; }

/* overlays */
#overlay:empty { display: none; }
#overlay { position: fixed; inset: 0; background: var(--board); z-index: 10; display: flex; flex-direction: column; max-width: 560px; margin: 0 auto; }
.ohead { display: flex; align-items: center; gap: 8px; padding: 10px 12px; background: var(--ink); color: #fff; }
.ohead h2 { flex: 1; font-size: 20px; }
.ohead .btn { background: transparent; color: #fff; border-color: #fff; }
.ohead .btn.primary { background: #fff; color: var(--ink); }
.obody { flex: 1; min-height: 0; overflow-y: auto; }
.tabs { display: flex; gap: 0; overflow-x: auto; background: var(--panel); border-bottom: 1px solid var(--line); scrollbar-width: none; }
.tabs button { border: 0; background: none; padding: 11px 13px; font-family: var(--f-display); font-size: 16px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; white-space: nowrap; color: var(--muted); border-bottom: 3px solid transparent; }
.tabs button.on { color: var(--ink); border-bottom-color: var(--ink); }
.pcard { display: grid; grid-template-columns: 120px 1fr; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--line); align-items: center; }
.pcard canvas { width: 120px; height: 113px; border-radius: 6px; background: var(--wood); border: 1px solid var(--line); }
.edwrap { padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }
#edcanvas { width: 100%; touch-action: none; border-radius: 8px; background: var(--wood); border: 1px solid var(--wood-dark); display: block; }
.hint { font-size: 13.5px; min-height: 19px; }
.hint b { background: var(--hi); padding: 0 4px; border-radius: 3px; }

/* live */
.live { flex: 1; min-height: 0; display: flex; flex-direction: column; }
#toast { padding: 7px 14px; font-size: 14.5px; font-weight: 500; min-height: 34px; background: var(--panel); border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 8px; }
#toast .sc { margin-left: auto; font-family: var(--f-display); font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; min-width: 28px; text-align: right; }
#toast .sc.low { color: var(--red); }
#courtwrap { flex: 1; min-height: 0; position: relative; background: #2a3240; }
#court { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; display: block; }
.calls { display: flex; flex-wrap: wrap; gap: 5px; padding: 6px 10px; align-items: center; background: var(--panel); border-top: 1px solid var(--line); scrollbar-width: none; }
.calls .tag { flex: none; }
.calls .btn { flex: none; padding: 7px 9px; font-size: 15px; white-space: nowrap; }
.calls .btn.arm { background: var(--hi); border-color: var(--ink); color: var(--ink); }
.calls:last-child { padding-bottom: calc(7px + env(safe-area-inset-bottom)); }
#livehint { padding: 4px 14px; font-size: 13px; background: var(--hi); display: none; }
#livehint.on { display: block; }
.center { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 16px; padding: 24px 20px; }
.big { font-family: var(--f-display); font-size: 64px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.loglist { font-size: 13.5px; color: var(--muted); display: grid; gap: 3px; }
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto; } }
</style>
</head>
<body>
<div id="app">
  <header id="hud"></header>
  <main id="screen"></main>
</div>
<div id="overlay"></div>
<script src="data.js"></script>
<script src="engine.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="app.js"></script>
</body>
</html>
